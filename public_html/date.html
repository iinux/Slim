<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        neutral: '#6B7280',
                        dark: '#1F2937',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .date-card {
                @apply bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-xl hover:-translate-y-1;
            }
            .date-input {
                @apply w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all;
            }
            .btn-add {
                @apply bg-primary hover:bg-primary/90 text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 shadow-md hover:shadow-lg;
            }
            .days-passed {
                @apply text-secondary font-bold text-2xl;
            }
            .days-remaining {
                @apply text-accent font-bold text-2xl;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-inter p-4 md:p-8">
    <div class="max-w-4xl mx-auto">

        <main>

            <div id="dates-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 日期卡片将通过JavaScript动态添加 -->
                <div class="date-card">
                    <div class="text-center">
                        <p class="text-neutral mb-2">今天</p>
                        <p class="text-dark text-xl font-medium mb-4" id="today-date"></p>
                        <p class="text-neutral">当前日期</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8">
                <div class="flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="new-date" class="block text-sm font-medium text-neutral mb-1">添加新日期</label>
                            <input type="date" id="new-date" class="date-input">
                        </div>
                        <div>
                            <label for="event-name" class="block text-sm font-medium text-neutral mb-1">事件名称</label>
                            <input type="text" id="event-name" class="date-input" placeholder="输入事件名称">
                        </div>
                    </div>
                    <button id="add-date" class="btn-add whitespace-nowrap">
                        <i class="fa fa-plus-circle"></i> 添加日期
                    </button>
                </div>
            </div>
        </main>

    </div>

    <script>
        // 添加从接口获取日期数据的函数
        async function fetchDatesFromAPI() {
            try {
                // 这里使用模拟API，实际项目中替换为真实接口地址
                const response = await fetch('/api/qxw/links/35/content');
                if (!response.ok) throw new Error('Network response was not ok');
                
                // 模拟返回的日期数据
                const mockData = [
                    { date: '2023-10-01', name: '国庆节' },
                    { date: '2023-12-25', name: '圣诞节' },
                    { date: '2024-01-01', name: '元旦节' },
                    { date: '2024-02-10', name: '春节' }
                ];
                
                return response.json();
            } catch (error) {
                console.error('获取日期数据失败:', error);
                return [];
            }
        }

        // 显示今天的日期
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('today-date').textContent = today.toLocaleDateString('zh-CN', options);

        // 获取本地存储的日期事件
        let savedEvents = JSON.parse(localStorage.getItem('dateTrackerEvents')) || [];

        // DOM元素
        const dateInput = document.getElementById('new-date');
        const eventNameInput = document.getElementById('event-name');
        const addDateButton = document.getElementById('add-date');
        const datesContainer = document.getElementById('dates-container');

        // 初始化页面 - 从API获取并合并本地数据
        document.addEventListener('DOMContentLoaded', async function() {
            const apiEvents = await fetchDatesFromAPI();
            console.log(apiEvents);
            // 合并API数据和本地数据，去重
            const combinedEvents = [...new Map([...apiEvents, ...savedEvents].map(item => [item.date, item])).values()];
            savedEvents = combinedEvents;
            localStorage.setItem('dateTrackerEvents', JSON.stringify(savedEvents));
            renderDateCards();
        });

        // 计算两个日期之间的天数差
        function calculateDaysDifference(selectedDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const date = new Date(selectedDate);
            date.setHours(0, 0, 0, 0);
            const diffTime = date - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // 格式化日期显示
        function formatDateForDisplay(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        // 创建日期卡片
        function createDateCard(event) {
            const { date, name } = event;
            const daysDifference = calculateDaysDifference(date);
            const formattedDate = formatDateForDisplay(date);
            const isPast = daysDifference < 0;
            const daysText = isPast ? `${Math.abs(daysDifference)} 天` : `${daysDifference} 天`;
            const statusText = isPast ? '已经过去' : '还剩';
            const statusClass = isPast ? 'days-passed' : 'days-remaining';

            const card = document.createElement('div');
            card.className = 'date-card relative';
            card.innerHTML = `
                <button class="absolute top-3 right-3 text-gray-400 hover:text-red-500 transition-colors" data-date="${date}">
                    <i class="fa fa-times-circle"></i>
                </button>
                <div class="text-center">
                    <p class="text-neutral mb-2">${statusText}</p>
                    <p class="${statusClass} mb-2">${daysText}</p>
                    <p class="font-bold text-dark mb-1">${name}</p>
                    <p class="text-dark text-lg font-medium mb-2">${formattedDate}</p>
                    <button class="text-primary text-sm hover:underline" data-date="${date}">
                        <i class="fa fa-pencil"></i> 编辑
                    </button>
                </div>
            `;

            // 删除按钮事件
            card.querySelector('button:first-child').addEventListener('click', function() {
                const dateToRemove = this.getAttribute('data-date');
                savedEvents = savedEvents.filter(event => event.date !== dateToRemove);
                localStorage.setItem('dateTrackerEvents', JSON.stringify(savedEvents));
                renderDateCards();
            });

            // 编辑按钮事件
            card.querySelector('button:last-child').addEventListener('click', function() {
                const dateToEdit = this.getAttribute('data-date');
                const eventToEdit = savedEvents.find(event => event.date === dateToEdit);
                if (eventToEdit) {
                    dateInput.value = eventToEdit.date;
                    eventNameInput.value = eventToEdit.name;
                    savedEvents = savedEvents.filter(event => event.date !== dateToEdit);
                    localStorage.setItem('dateTrackerEvents', JSON.stringify(savedEvents));
                    addDateButton.textContent = '更新日期';
                    addDateButton.dataset.action = 'update';
                    addDateButton.dataset.originalDate = dateToEdit;
                    // 滚动到输入框
                    dateInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    dateInput.focus();
                }
            });

            return card;
        }

        // 渲染所有日期卡片
        function renderDateCards() {
            // 清除现有卡片（保留"今天"卡片）
            const todayCard = document.querySelector('#dates-container .date-card:first-child');
            datesContainer.innerHTML = '';
            datesContainer.appendChild(todayCard);

            // 添加已保存的日期卡片
            savedEvents.sort((a, b) => new Date(a.date) - new Date(b.date))
                .forEach(event => {
                    const card = createDateCard(event);
                    datesContainer.appendChild(card);
                });
        }

        // 添加日期按钮事件
        addDateButton.addEventListener('click', function() {
            const dateValue = dateInput.value;
            const eventName = eventNameInput.value.trim();
            if (!dateValue || !eventName) {
                alert('请输入日期和事件名称');
                return;
            }

            // 如果是更新操作
            if (this.dataset.action === 'update') {
                const originalDate = this.dataset.originalDate;
                savedEvents = savedEvents.filter(event => event.date !== originalDate);
                this.textContent = '添加日期';
                this.removeAttribute('data-action');
                this.removeAttribute('data-original-date');
            }

            // 检查日期是否已存在
            const dateExists = savedEvents.some(event => event.date === dateValue);
            if (!dateExists) {
                savedEvents.push({ date: dateValue, name: eventName });
                // 按日期排序
                savedEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                localStorage.setItem('dateTrackerEvents', JSON.stringify(savedEvents));
                renderDateCards();
                // 清空输入框
                dateInput.value = '';
                eventNameInput.value = '';
            } else {
                alert('该日期已存在，请选择其他日期');
            }
        });

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            renderDateCards();
        });
    </script>
</body>
</html>
